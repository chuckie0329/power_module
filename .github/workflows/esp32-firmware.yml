name: ESP32 firmware

on:
  push:
    branches: [ci/fw-v1.2.4, ship/fw-v1.2.4]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'
      - name: Build the pinned ESP32 OTA profile
        run: arduino-cli compile --profile power_module --build-path "$RUNNER_TEMP/esp32" firmware/PowerModule
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyserial==3.5
      - name: Test reconnect encoding and client firmware validation
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://codeload.github.com/bblanchon/ArduinoJson/tar.gz/refs/tags/v7.4.2 | tar -xz -C "$RUNNER_TEMP"
          g++ -std=c++17 -Wall -Wextra -I "$RUNNER_TEMP/ArduinoJson-7.4.2/src" -I firmware/PowerModule \
            tools/tests/reconnect_encoder.cpp firmware/PowerModule/Protocol.cpp -o "$RUNNER_TEMP/reconnect-encoder"
          g++ -std=c++17 -Wall -Wextra -Werror -I firmware/PowerModule tools/tests/bond_recovery.cpp -o "$RUNNER_TEMP/bond-recovery"
          "$RUNNER_TEMP/bond-recovery"
          g++ -std=c++17 -Wall -Wextra -Werror -I firmware/PowerModule tools/tests/ble_recovery.cpp -o "$RUNNER_TEMP/ble-recovery"
          "$RUNNER_TEMP/ble-recovery"
          g++ -std=c++17 -Wall -Wextra -Werror -I "$RUNNER_TEMP/ArduinoJson-7.4.2/src" -I firmware/PowerModule tools/tests/diag_log.cpp firmware/PowerModule/Protocol.cpp -o "$RUNNER_TEMP/diag-log"
          "$RUNNER_TEMP/diag-log"
          python3 -m tools.tests.check_diagnostics_contract "$RUNNER_TEMP/diag-log"
          python3 -m tools.tests.check_firmware_release "$RUNNER_TEMP/reconnect-encoder" "$RUNNER_TEMP/esp32/PowerModule.ino.bin" 1.2.4
          mkdir -p dist
          cp "$RUNNER_TEMP/esp32/PowerModule.ino.bin" dist/PowerModule-ESP32.bin
      - uses: actions/upload-artifact@v4
        with:
          name: PowerModule-ESP32-OTA
          path: dist/PowerModule-ESP32.bin
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ship/fw-v1.2.4'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PowerModule-ESP32-OTA
          path: dist
      - name: Publish one firmware-only release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'from pc_client.firmware_update import FirmwareImage; print(FirmwareImage.load("dist/PowerModule-ESP32.bin").version)')"
          tag="fw-v$version"
          test "$tag" = fw-v1.2.4
          test "ship/$tag" = "$GITHUB_REF_NAME"
          test "$GITHUB_SHA" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          (cd dist; sha256sum PowerModule-ESP32.bin > SHA256SUMS.txt)
          gh release create "$tag" dist/PowerModule-ESP32.bin dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --latest=false --title "PowerModule ESP32 v$version" \
            --notes "增加 USB 诊断日志，记录近期 BLE 连接、认证、断线和广播恢复；修复掉线后可能无法再次发现。建议配合 PC v1.0.6 使用。仅包含 OTA 应用镜像，升级前关闭主输出和两路继电器。"
