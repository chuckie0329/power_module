name: Windows PC client

on:
  push:
    branches: [main, ci/pc-v1.0.1, ship/pc-v1.0.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install pinned client and PyInstaller
        id: dependencies
        run: python -m pip install -r pc_client/requirements.txt pyinstaller==6.16.0
      - name: Run source regression tests
        env:
          QT_QPA_PLATFORM: windows
        run: python -m unittest discover -s pc_client/tests -v
      - name: Build Windows executable
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        id: compile
        run: ./tools/build_pc_windows.ps1
      - name: Start the frozen Windows GUI and check resources
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: ./tools/smoke_pc_windows.ps1
      - name: Exercise self-update handoff on Windows
        run: ./tools/smoke_pc_upgrade_windows.ps1
      - name: Retain verified executable
        uses: actions/upload-artifact@v4
        with:
          name: PowerModule-PC-windows-x64
          path: pc_client/build/PowerModule-PC.exe
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ship/pc-v1.0.1'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PowerModule-PC-windows-x64
          path: dist
      - name: Publish one PC-only release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'from pc_client.version import PC_VERSION; print(PC_VERSION)')"
          tag="pc-v$version"
          test "$tag" = pc-v1.0.1
          test "ship/$tag" = "$GITHUB_REF_NAME"
          test "$GITHUB_SHA" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          (cd dist; sha256sum PowerModule-PC.exe > SHA256SUMS.txt)
          gh release create "$tag" dist/PowerModule-PC.exe dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --latest=false --title "PowerModule PC v$version" \
            --notes "统一客户端与固件升级入口；复用已校验的本地固件；新版客户端启动并重连原设备后才移除旧 EXE。首次从 v1.0.0 升级须手动下载并运行。此发布不含 ESP32 固件。"
