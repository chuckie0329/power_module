name: Windows PC client

on:
  push:
    branches: [main, ci/pc-v1.0.6, ship/pc-v1.0.6]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install pinned client and PyInstaller
        id: dependencies
        run: python -m pip install -r pc_client/requirements.txt pyinstaller==6.16.0
      - name: Run source regression tests
        env:
          QT_QPA_PLATFORM: windows
        run: python -m unittest discover -s pc_client/tests -v
      - name: Build Windows executable
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        id: compile
        run: ./tools/build_pc_windows.ps1
      - name: Start the frozen Windows GUI and check resources
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: ./tools/smoke_pc_windows.ps1
      - name: Exercise self-update handoff on Windows
        run: ./tools/smoke_pc_upgrade_windows.ps1
      - name: Validate the official v1.0.5 predecessor identity
        shell: pwsh
        run: |
          $old = Join-Path $env:RUNNER_TEMP 'PowerModule-PC.exe'
          curl.exe -fsSL --retry 3 'https://github.com/chuckie0329/power_module/releases/download/pc-v1.0.5/PowerModule-PC.exe' -o $old
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash -Algorithm SHA256 -LiteralPath $old).Hash.ToLowerInvariant() -ne 'f1231f9c3e6f329ebcbe73fc01255b629512aba39d0a939045f582c6b9c8f1c4') { throw 'Invalid predecessor checksum' }
          python -c "from pathlib import Path; import sys; from pc_client.pc_upgrade import _predecessor; assert _predecessor(Path(sys.argv[1]), '1.0.5', '1.0.6')" $old
          if ($LASTEXITCODE -ne 0) { throw 'Invalid old client identity' }
      - name: Exercise the tagged v1.0.3 migration on Windows
        run: ./tools/smoke_legacy_upgrade_windows.ps1
      - name: Retain verified executable
        uses: actions/upload-artifact@v4
        with:
          name: PowerModule-PC-windows-x64
          path: pc_client/build/PowerModule-PC.exe
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ship/pc-v1.0.6'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PowerModule-PC-windows-x64
          path: dist
      - name: Publish one PC-only release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'from pc_client.version import PC_VERSION; print(PC_VERSION)')"
          tag="pc-v$version"
          test "$tag" = pc-v1.0.6
          test "ship/$tag" = "$GITHUB_REF_NAME"
          test "$GITHUB_SHA" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          (cd dist; sha256sum PowerModule-PC.exe > SHA256SUMS.txt)
          gh release create "$tag" dist/PowerModule-PC.exe dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --latest=false --title "PowerModule PC v$version" \
            --notes "新增 USB 固件诊断，可本地导出 ESP32 的 BLE 事件日志（需固件 v1.2.4）。保留 PowerModule-PC.exe 文件名和升级后重连。"
