name: Windows PC client

on:
  push:
    branches: [main, ci/pc-v1.1.0, ship/pc-v1.1.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install pinned client and PyInstaller
        id: dependencies
        run: python -m pip install -r pc_client/requirements.txt pyinstaller==6.16.0
      - name: Run source regression tests
        env:
          QT_QPA_PLATFORM: windows
        run: python -m unittest discover -s pc_client/tests -v
      - name: Build Windows executable
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        id: compile
        run: ./tools/build_pc_windows.ps1
      - name: Start the frozen Windows GUI and check resources
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: ./tools/smoke_pc_windows.ps1
      - name: Exercise self-update handoff on Windows
        run: ./tools/smoke_pc_upgrade_windows.ps1
      - name: Validate the official v1.0.10 predecessor identity
        shell: pwsh
        run: |
          $old = Join-Path $env:RUNNER_TEMP 'PowerModule-PC.exe'
          curl.exe -fsSL --retry 3 'https://github.com/chuckie0329/power_module/releases/download/pc-v1.0.10/PowerModule-PC.exe' -o $old
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash -Algorithm SHA256 -LiteralPath $old).Hash.ToLowerInvariant() -ne 'b5c2c4b937d8b0c680a99cf7374c6a3f25f757ddc7c0dc342723918cf340bb8c') { throw 'Invalid predecessor checksum' }
          python -c "from pathlib import Path; import sys; from pc_client.pc_upgrade import _predecessor; assert _predecessor(Path(sys.argv[1]), '1.0.10', '1.1.0')" $old
          if ($LASTEXITCODE -ne 0) { throw 'Invalid old client identity' }
      - name: Exercise the tagged v1.0.3 migration on Windows
        run: ./tools/smoke_legacy_upgrade_windows.ps1
      - name: Retain verified executable
        uses: actions/upload-artifact@v4
        with:
          name: PowerModule-PC-windows-x64
          path: pc_client/build/PowerModule-PC.exe
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ship/pc-v1.1.0'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PowerModule-PC-windows-x64
          path: dist
      - name: Publish one PC-only release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'from pc_client.version import PC_VERSION; print(PC_VERSION)')"
          tag="pc-v$version"
          test "$tag" = pc-v1.1.0
          test "ship/$tag" = "$GITHUB_REF_NAME"
          test "$GITHUB_SHA" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          (cd dist; sha256sum PowerModule-PC.exe > SHA256SUMS.txt)
          gh release create "$tag" dist/PowerModule-PC.exe dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --latest=false --title "PowerModule PC v$version" \
            --notes "新增「时序控制」：按步骤操作 K1、K2 和主输出。下拉选择即载入，在主界面运行或停止。首次保存时在 EXE 同级创建 sequences 文件夹。选择不会执行时序，停止不会自动关断。固件无需升级，EXE 文件名保持不变。"

      - name: Verify public executable and checksum
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/pc-v1.1.0"
          mkdir -p verification
          curl -fsSL --retry 5 --retry-all-errors "$base/PowerModule-PC.exe" -o verification/PowerModule-PC.exe
          curl -fsSL --retry 5 --retry-all-errors "$base/SHA256SUMS.txt" -o verification/SHA256SUMS.txt
          cmp dist/SHA256SUMS.txt verification/SHA256SUMS.txt
          (cd verification; sha256sum --check SHA256SUMS.txt)
