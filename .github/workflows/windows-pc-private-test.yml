name: Windows PC BLE and layout test
on:
  push:
    branches: [ci/ble-layout-exe-test]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install pinned client and PyInstaller
        run: python -m pip install -r pc_client/requirements.txt pyinstaller==6.16.0
      - name: Run native regressions including first-open layout and PIN paths
        env:
          QT_QPA_PLATFORM: windows
        run: python -m unittest discover -s pc_client/tests -v
      - name: Mark this executable as a private test and build
        shell: pwsh
        run: |
          python -c "from pathlib import Path; p=Path('pc_client/app.py'); a=p.read_text(encoding='utf-8'); a=a.replace('v{PC_VERSION}', 'v{PC_VERSION} [TEST 2]'); p.write_text(a,encoding='utf-8')"
          if ($LASTEXITCODE -ne 0) { throw 'Could not label the test UI.' }
          ./tools/build_pc_windows.ps1
      - name: Start the packaged GUI and verify icon, version and update catalogs
        run: ./tools/smoke_pc_windows.ps1
      - name: Record the executable checksum
        shell: pwsh
        run: |
          $exe = Get-Item 'pc_client/build/PowerModule-PC.exe'
          $sha = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          "$sha  PowerModule-PC.exe" | Set-Content -Encoding ascii 'pc_client/build/SHA256SUMS.txt'
          Write-Output "TEST_ASSET $sha $($exe.Length)"
      - uses: actions/upload-artifact@v4
        with:
          name: PowerModule-PC-BLE-Layout-TEST2
          path: |
            pc_client/build/PowerModule-PC.exe
            pc_client/build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
